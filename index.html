<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0908" />
  
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wander" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
    <!-- Favicon (SVG for browser tab — this still works fine) -->
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
  
    <title>wander</title>
    <script>
      // Inside Hive's frame: no pinch or double-tap zoom (Hive can't stop a pinch that starts in here).
      // Leaflet maps still pinch-zoom: they handle the gesture themselves.
      if (window.parent !== window) {
        document.documentElement.classList.add('in-frame');
        document.documentElement.style.touchAction = 'pan-x pan-y';
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      }
    </script>
    <style>
      /* The phone's safe areas (notch, home indicator), as variables the app's CSS
         uses instead of env(). Inside Hive's frame they are 0: on iOS the frame
         is handed the screen's insets too, and Hive already keeps its frame clear
         of them, so using them here doubled the gaps top and bottom. */
      :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
      html.in-frame { --safe-top: 0px; --safe-right: 0px; --safe-bottom: 0px; --safe-left: 0px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
